name: Verify Games (remove expired promotions)

on:
  schedule:
    # Antes rodava a cada 12h -- com um catálogo de 10-15 mil jogos na Steam,
    # isso levaria dias pra cobrir tudo (cada execução só reconfere uma
    # fatia). Rodando a cada 10 min, a fatia de 300 jogos por vez dá conta
    # do catálogo inteiro em poucas horas, girando o cursor.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} 

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de verificação
        run: |
          curl -sS -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/sync-verify"